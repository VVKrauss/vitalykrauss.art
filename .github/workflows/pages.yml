name: Deploy site

on:
  push:
    branches:
      - main
      - cursor/artist-portfolio-3c22
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Attach custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api --method PUT "repos/${{ github.repository }}/pages" \
            -f cname='vitalykrauss.art' \
            -F https_enforced=false > /tmp/pages-domain.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Apex domain was rejected. Attaching www.vitalykrauss.art."
            gh api --method PUT "repos/${{ github.repository }}/pages" \
              -f cname='www.vitalykrauss.art' \
              -F https_enforced=false
          else
            cat /tmp/pages-domain.json
          fi

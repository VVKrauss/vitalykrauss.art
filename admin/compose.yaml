name: vitalykrauss-studio

services:
  studio:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4174
      AUTH_DATABASE_PATH: /app/.data/auth.sqlite
    ports:
      - '127.0.0.1:${STUDIO_BIND_PORT:-4174}:4174'
    volumes:
      - auth-data:/app/.data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100
    healthcheck:
      test: ['CMD', 'node', 'scripts/healthcheck.mjs']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  auth-data:

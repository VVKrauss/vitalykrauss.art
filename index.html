<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Art catalogue</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#f5f2eb">
  <script>
    try {
      if (localStorage.getItem('vk-theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name="theme-color"]').content = '#191a18';
      }
    } catch (_) {}
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,520;0,9..144,620;1,9..144,520&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.5 13.5A8.8 8.8 0 0 1 10.5 3 9 9 0 1 0 20.5 13.5Z"/></symbol>
    <symbol id="icon-link" viewBox="0 0 24 24"><path d="M9 15l6-6M10 7l1-1a4 4 0 0 1 6 6l-1 1M14 17l-1 1a4 4 0 0 1-6-6l1-1"/></symbol>
    <symbol id="icon-instagram" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="icon-facebook" viewBox="0 0 24 24"><path d="M14 21v-7h3l1-4h-4V7.5A1.5 1.5 0 0 1 15.5 6H18V2.5A20 20 0 0 0 15 2a5 5 0 0 0-5 5v3H7v4h3v7"/></symbol>
    <symbol id="icon-x" viewBox="0 0 24 24"><path d="M4 4l16 16M20 4L4 20"/></symbol>
    <symbol id="icon-linkedin" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 11v6M8 8v.01M12 17v-4a2 2 0 0 1 4 0v4M12 13v4"/></symbol>
    <symbol id="icon-youtube" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M11 9.5v5l4-2.5-4-2.5Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="icon-behance" viewBox="0 0 24 24"><path d="M3 7h5a2.5 2.5 0 0 1 0 5H3V7Zm0 5h5.5a2.5 2.5 0 0 1 0 5H3v-5ZM14 10h6M14 13.5a3.3 3.3 0 0 0 6 .8M14.3 13A3.3 3.3 0 0 1 17.5 10a3.3 3.3 0 0 1 3.2 2.6"/></symbol>
    <symbol id="icon-pinterest" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 19c1-3 2-7 2-9a2.5 2.5 0 0 1 5 0c0 2-1 4.5-3 4.5s-2.5-1.5-2-3"/></symbol>
    <symbol id="icon-tiktok" viewBox="0 0 24 24"><path d="M14 4v10.5a3 3 0 1 1-3-3M14 4a4 4 0 0 0 4 4"/></symbol>
    <symbol id="icon-telegram" viewBox="0 0 24 24"><path d="m4 11 16-6-3 15-6-4-3 3v-5l8-7-11 6Z"/></symbol>
    <symbol id="icon-whatsapp" viewBox="0 0 24 24"><path d="M6 19l1-4a7.5 7.5 0 1 1 3 3l-4 1Z"/><path d="M9.5 10.5c.3 2 2 3.7 4 4" stroke-linecap="round"/></symbol>
    <symbol id="icon-vk" viewBox="0 0 24 24"><path d="M4 4c.2 9 4 15 11 15M4 4h3c.5 4.5 2 7.5 4 9V4h3v6c2-1 3.5-3.5 4-6h3c-.5 3-2 5.5-4 7 2 1.5 3.5 4 4 8"/></symbol>
    <symbol id="icon-threads" viewBox="0 0 24 24"><path d="M12 3c-5 0-7 3-7 9s2 9 7 9 7-3 7-7c0-2.5-1.5-4-4-4-2.5 0-3.5 1.5-3 3.5.4 1.5 2 2 3.5 1.5"/></symbol>
  </svg>
  <a class="skip" href="#works" data-i18n="skip">Skip to works</a>
  <header class="site-header">
    <a class="wordmark brand-logo" href="#top" aria-label="Art catalogue"><img src="images/logo-vk.png" alt="" width="54" height="54"></a>
    <button type="button" id="menu-toggle" class="icon-button menu-toggle" data-i18n-aria="menu.label" aria-label="Menu" aria-expanded="false" aria-controls="site-navigation"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <nav id="site-navigation" class="site-nav" data-i18n-aria="nav.label" aria-label="Navigation"></nav>
    <div class="header-tools">
      <div class="cart-menu"><button type="button" id="cart-toggle" class="icon-button" aria-label="Cart" aria-expanded="false" aria-controls="cart-dropdown"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h2l2 12h12l2-9H6M8 20h.01M18 20h.01"/></svg><span id="cart-count">0</span></button><div id="cart-dropdown" hidden></div></div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme">
        <svg class="theme-icon theme-moon" aria-hidden="true"><use href="#icon-moon"/></svg>
        <svg class="theme-icon theme-sun" aria-hidden="true"><use href="#icon-sun"/></svg>
      </button>
      <div class="langs" role="group" data-i18n-aria="lang.group" aria-label="Language">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="ru" lang="ru">RU</button>
        <button type="button" data-lang="es" lang="es">ES</button>
      </div>
    </div>
  </header>

  <main id="top">
    <div id="catalogue-status" class="catalogue-status" role="status" aria-live="polite"><p data-i18n="catalogue.loading">Loading catalogue…</p></div>
    <div id="catalogue-content" hidden>
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-copy">
          <h1 id="artist-name"></h1>
          <p class="lede" data-hero-intro></p>
        </div>
        <figure class="hero-figure" hidden>
          <img width="1" height="1" alt="" id="hero-image">
          <figcaption></figcaption>
        </figure>
      </div>
    </section>

    <section id="works" class="section"></section>
    <section id="exhibitions" class="section"></section>
    <section id="about" class="section" aria-labelledby="about-title">
      <p class="section-label" data-i18n="about.label">About me</p>
      <div class="about-layout">
        <div class="about-identity"><img id="author-avatar" class="author-avatar" src="images/author.webp" width="180" height="180" alt=""><p class="eyebrow" id="about-role" data-author-role></p><h2 id="about-title" ></h2></div>
        <div class="about-copy">
          <p class="about-intro" data-author-intro></p>
          <p data-author-description></p>
        </div>
      </div>
    </section>
    <section id="contact" class="section"></section>
    <section id="shop" class="section"></section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p data-i18n="footer.credit">made with love by redflow d</p>
    </div>
  </footer>

  <dialog id="viewer">
    <div id="viewer-body"></div>
  </dialog>
  <dialog id="request-dialog">
    <div id="request-body"></div>
  </dialog>

  <script src="js/i18n.js"></script>
  <script src="js/content.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

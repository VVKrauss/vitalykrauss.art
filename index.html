<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitaly Krauss</title>
  <meta name="description" content="Vitaly Krauss, digital artist. Series, exhibitions, prints.">
  <meta name="theme-color" content="#f5f2eb">
  <script>
    try {
      if (localStorage.getItem('vk-theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name="theme-color"]').content = '#191a18';
      }
    } catch (_) {}
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,520;0,9..144,620;1,9..144,520&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.5 13.5A8.8 8.8 0 0 1 10.5 3 9 9 0 1 0 20.5 13.5Z"/></symbol>
  </svg>
  <a class="skip" href="#series" data-i18n="skip">Skip to works</a>
  <header class="site-header">
    <a class="wordmark brand-logo" href="#top" aria-label="Vitaly Krauss"><img src="images/logo-vk.png" alt="" width="54" height="54"></a>
    <button type="button" id="menu-toggle" class="icon-button menu-toggle" aria-label="Menu" aria-expanded="false" aria-controls="site-navigation"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <nav id="site-navigation" class="site-nav" aria-label="Vitaly Krauss">
      <a href="#series" data-i18n="nav.series">Series</a>
      <a href="#exhibitions" data-i18n="nav.exhibitions">Exhibitions</a>
      <a href="#shop" data-i18n="nav.shop">Shop</a>
      <a href="#about" data-i18n="nav.about">About me</a>
    </nav>
    <div class="header-tools">
      <div class="cart-menu"><button type="button" id="cart-toggle" class="icon-button" aria-label="Cart" aria-expanded="false" aria-controls="cart-dropdown"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h2l2 12h12l2-9H6M8 20h.01M18 20h.01"/></svg><span id="cart-count">0</span></button><div id="cart-dropdown" hidden></div></div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme">
        <svg class="theme-icon theme-moon" aria-hidden="true"><use href="#icon-moon"/></svg>
        <svg class="theme-icon theme-sun" aria-hidden="true"><use href="#icon-sun"/></svg>
      </button>
      <div class="langs" role="group" data-i18n-aria="lang.group" aria-label="Language">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="ru" lang="ru">RU</button>
        <button type="button" data-lang="es" lang="es">ES</button>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-copy">
          <p class="eyebrow"><span class="small-index">01 /</span> <span data-i18n="role">Digital artist</span></p>
          <h1>Vitaly<br>Krauss</h1>
          <p class="lede" data-i18n="hero.lede">Insecterra looks at the insect world that is always here, and usually unseen.</p>
          <a class="text-link" href="#series"><span data-i18n="hero.cta">View the series</span><svg class="icon" aria-hidden="true"><use href="#icon-arrow"/></svg></a>
        </div>
        <figure class="hero-figure">
          <img src="images/insecterra/snail.webp" width="2200" height="1178" alt="Snail, Insecterra" id="hero-image">
          <figcaption><span>Insecterra</span><span data-i18n="hero.caption">Snail · 2025</span></figcaption>
        </figure>
      </div>
    </section>

    <section id="series" class="section"></section>
    <section id="exhibitions" class="section"></section>
    <section id="shop" class="section"></section>
    <section id="about" class="section" aria-labelledby="about-title">
      <p class="section-label" data-i18n="about.label">About me</p>
      <div class="about-layout">
        <div class="about-identity"><img id="author-avatar" class="author-avatar" src="images/author.webp" width="180" height="180" alt="Vitaly Krauss"><p class="eyebrow" id="about-role" data-i18n="role">Digital artist</p><h2 id="about-title" data-i18n="about.heading">Vitaly Krauss</h2></div>
        <div class="about-copy">
          <p class="about-intro" data-i18n="about.intro"></p>
          <p data-i18n="about.text"></p>
          <a id="about-email" class="text-link" href="mailto:kraussvitaliy@gmail.com"><span>kraussvitaliy@gmail.com</span><svg class="icon" aria-hidden="true"><use href="#icon-arrow"/></svg></a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>made with love by redflow d</p>
    </div>
  </footer>

  <dialog id="viewer">
    <div id="viewer-body"></div>
  </dialog>
  <dialog id="request-dialog">
    <div id="request-body"></div>
  </dialog>

  <script src="js/content.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

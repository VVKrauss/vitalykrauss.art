<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitaly Krauss</title>
  <meta name="description" content="Vitaly Krauss, digital artist. Series, exhibitions, prints and paintings.">
  <meta name="theme-color" content="#070707">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,520;0,9..144,620;1,9..144,520&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#series" data-i18n="skip">Skip to works</a>
  <header class="site-header">
    <a class="wordmark" href="#top">Vitaly Krauss</a>
    <nav class="site-nav" aria-label="Vitaly Krauss">
      <a href="#series" data-i18n="nav.series">Series</a>
      <a href="#exhibitions" data-i18n="nav.exhibitions">Exhibitions</a>
      <a href="#shop" data-i18n="nav.shop">Shop</a>
    </nav>
    <div class="header-tools">
      <button type="button" class="request-open" id="open-request">
        <span data-i18n="nav.request">Request</span>
        <span id="request-count" hidden>0</span>
      </button>
      <div class="langs" role="group" data-i18n-aria="lang.group" aria-label="Language">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="ru" lang="ru">RU</button>
        <button type="button" data-lang="es" lang="es">ES</button>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-copy">
          <p class="eyebrow" data-i18n="role">Digital artist</p>
          <h1>Vitaly<br>Krauss</h1>
          <p class="lede" data-i18n="hero.lede">Insecterra looks at the insect world that is always here, and usually unseen.</p>
          <a class="text-link" href="#series" data-i18n="hero.cta">View the series</a>
        </div>
        <figure class="hero-figure">
          <img src="images/insecterra/snail.webp" width="2200" height="1178" alt="Snail, Insecterra" id="hero-image">
        </figure>
      </div>
    </section>

    <section id="series" class="section"></section>
    <section id="exhibitions" class="section"></section>
    <section id="shop" class="section"></section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="wordmark">Vitaly Krauss</p>
      <p data-i18n="footer.note">Prints and paintings are released by request.</p>
      <a id="footer-email" href="mailto:studio@vitalykrauss.art">studio@vitalykrauss.art</a>
    </div>
  </footer>

  <dialog id="viewer">
    <div id="viewer-body"></div>
  </dialog>
  <dialog id="request-dialog">
    <div id="request-body"></div>
  </dialog>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
